# sift — optional configuration override file.
#
# Everything is auto-discovered from your existing OpenClaw setup, so an
# empty/missing file works out of the box. Add values here ONLY to override
# the discovered defaults. Point sift at a custom path with SIFT_CONFIG, or
# leave it at ~/.config/sift/config.toml.
#
# NOTE: do not paste secrets (JMAP token, API keys) into this file if you plan
# to commit it. sift reads the Fastmail JMAP token and DeepSeek key from your
# existing OpenClaw keychain/.env automatically.

[deepseek]
# base_url = "https://api.deepseek.com"
# model = "deepseek-v4-flash"
# api_key = ""            # leave empty to read DEEPSEEK_API_KEY / ~/.openclaw/.env

[fastmail]
# user = "you@example.com"
# account_id = "<account-id>"
# api_url = "https://<api-host>.fastmail.com/jmap/api/"
# -- Over SSH the macOS keychain is often unavailable; run `sift setup` to write
# -- the JMAP token here once (uses the keychain from your desktop session).
# token = ""
# [fastmail.folders]
# inbox = "<inbox-mailbox-id>"
# archive = "<archive-mailbox-id>"
# receipts = "<receipts-mailbox-id>"
# reading = "<reading-mailbox-id>"

[gmail]
# account = "you@workspace.example"
# gog_bin = "/usr/local/bin/gog"
# inbox_label = "INBOX"
# receipts_label = "Receipts"
# reading_label = "Reading"
# -- Gmail over SSH (macOS keychain is locked). Add ONE of these; `sift setup gmail`
# -- writes the client_id/client_secret and shows all options:
# service_account_json = "/path/to/service-account.json"   # Workspace domain-wide delegation (no expiry)
# refresh_token      = "..."                               # OAuth refresh token (uses client_id/client_secret above)
# access_token       = "..."                               # short-lived ~1h token (quick test)

# Senders whose promotions are kept (never archived). Add one per line.
# whitelist = ["friend@example.com"]
